<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks &amp; Compliance | AquaSentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="js/tailwind-config.js"></script>
    <script src="js/firebase-config.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-aquaDark text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white">

    <div id="sidebar-backdrop"></div>
    <aside id="sidebar"></aside>

    <div class="app-main">
        <header id="topbar"></header>

        <main class="p-4 sm:p-6 lg:p-8 space-y-6 max-w-[1400px] mx-auto">

            <div id="stat-tiles" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>

            <!-- Tabs -->
            <div class="flex items-center gap-2 border-b border-slate-800">
                <button data-tab="tasks" class="tab-btn px-4 py-2.5 text-sm font-semibold text-cyan-400 border-b-2 border-cyan-400">
                    <i class="fa-solid fa-list-check mr-2"></i>Inspection Tasks
                </button>
                <button data-tab="reports" class="tab-btn px-4 py-2.5 text-sm font-semibold text-slate-400 border-b-2 border-transparent">
                    <i class="fa-solid fa-file-shield mr-2"></i>Compliance Reports
                </button>
            </div>

            <!-- Tasks panel -->
            <div id="panel-tasks" class="glass-panel rounded-3xl border border-slate-800 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full data-table">
                        <thead>
                            <tr>
                                <th>Task</th>
                                <th>Site</th>
                                <th>Assigned To</th>
                                <th>Due</th>
                                <th>Priority</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tasks-table"></tbody>
                    </table>
                </div>
            </div>

            <!-- Reports panel -->
            <div id="panel-reports" class="glass-panel rounded-3xl border border-slate-800 overflow-hidden hidden">
                <div class="overflow-x-auto">
                    <table class="w-full data-table">
                        <thead>
                            <tr>
                                <th>Site</th>
                                <th>Period</th>
                                <th>Status</th>
                                <th>Due</th>
                                <th>Submitted By</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="reports-table"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Submit report modal -->
    <div id="report-modal-backdrop" class="fixed inset-0 bg-black/60 z-[60] opacity-0 pointer-events-none transition-opacity flex items-center justify-center p-4">
        <div class="glass-panel rounded-3xl border border-cyan-500/20 w-full max-w-md p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-display text-lg font-bold text-white">Submit Compliance Report</h2>
                <button id="report-modal-close" class="w-8 h-8 rounded-lg glass-panel flex items-center justify-center text-slate-300 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="report-form" class="space-y-4">
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Site / Period</label>
                    <div id="report-modal-meta" class="text-sm text-white font-semibold"></div>
                </div>
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Notes</label>
                    <textarea rows="3" class="w-full bg-slate-900 border border-slate-700 text-sm text-white rounded-xl px-3 py-2 focus:outline-none focus:border-cyan-500" placeholder="Summary of water quality, incidents, and corrective actions for this period..."></textarea>
                </div>
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Evidence Attachment</label>
                    <div class="border border-dashed border-slate-700 rounded-xl px-3 py-4 text-center text-xs text-slate-500">
                        <i class="fa-solid fa-paperclip mr-1.5"></i>Attach sensor logs / incident evidence
                    </div>
                </div>
                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-3 rounded-xl transition-all">Submit Report</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/tasks.js"></script>
</body>
</html>
