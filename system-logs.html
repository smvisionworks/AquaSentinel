<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Logs | AquaSentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="js/tailwind-config.js"></script>
    <script src="js/firebase-config.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-aquaDark text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white">

    <div id="sidebar-backdrop"></div>
    <aside id="sidebar"></aside>

    <div class="app-main">
        <header id="topbar"></header>

        <main class="p-4 sm:p-6 lg:p-8 space-y-6 max-w-[1000px] mx-auto">

            <div class="glass-panel rounded-2xl border border-slate-800 p-4 flex flex-wrap items-center gap-3">
                <i class="fa-solid fa-robot text-cyan-400 ml-1"></i>
                <p class="text-xs text-slate-400 flex-1 min-w-[240px]">
                    Every time an incident is logged, AquaSentinel's AI Compliance Agent reads the site's recent
                    sensor history and writes a plain-language report below — it only explains and recommends;
                    the severity itself is always decided by the fixed threshold rules, never by the AI.
                </p>
                <select id="filter-severity" class="bg-slate-900 border border-slate-700 text-sm text-white rounded-xl px-3 py-2 focus:outline-none focus:border-cyan-500">
                    <option value="all">All Severities</option>
                    <option value="critical">Critical</option>
                    <option value="warning">Warning</option>
                </select>
                <span class="text-xs text-slate-500" id="result-count"></span>
            </div>

            <div id="reports-list" class="space-y-4"></div>

        </main>
    </div>

    <script type="module" src="js/system-logs.js"></script>
</body>
</html>
