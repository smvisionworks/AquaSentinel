<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Detail | AquaSentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="js/tailwind-config.js"></script>
    <script src="js/firebase-config.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-aquaDark text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white">

    <div id="sidebar-backdrop"></div>
    <aside id="sidebar"></aside>

    <div class="app-main">
        <header id="topbar"></header>

        <main class="p-4 sm:p-6 lg:p-8 space-y-6 max-w-[1400px] mx-auto">

            <!-- Site header -->
            <div id="site-header" class="glass-panel rounded-3xl border border-cyan-500/20 glow-box p-6"></div>

            <!-- Edge processing pipeline -->
            <div class="glass-panel rounded-3xl border border-slate-800 p-6">
                <div class="text-xs uppercase tracking-widest text-cyan-400 font-semibold mb-1">Edge Processing Pipeline</div>
                <h2 class="font-display text-lg font-bold text-white mb-6">Sense → Decide → Act → Send</h2>
                <div id="pipeline" class="flex items-start"></div>
            </div>

            <!-- Sensor cards -->
            <div>
                <h2 class="font-display text-lg font-bold text-white mb-4">Live Sensor Readings</h2>
                <div id="sensor-cards" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <!-- Actuators -->
            <div>
                <h2 class="font-display text-lg font-bold text-white mb-4">Physical Response Actuators</h2>
                <div id="actuator-cards" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Recent incidents -->
                <div class="glass-panel rounded-3xl border border-slate-800 p-6">
                    <h2 class="font-display text-lg font-bold text-white mb-4">Recent Incidents</h2>
                    <div id="site-incidents" class="space-y-3"></div>
                </div>

                <!-- Reading log -->
                <div class="glass-panel rounded-3xl border border-slate-800 p-6 overflow-hidden">
                    <h2 class="font-display text-lg font-bold text-white mb-2">Reading Log</h2>
                    <div class="overflow-x-auto -mx-2">
                        <table class="w-full data-table">
                            <thead><tr><th>Time</th><th>Conductivity</th><th>Water Level</th><th>Water Flow</th><th>Gas (CO₂)</th></tr></thead>
                            <tbody id="reading-log"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="js/charts.js"></script>
    <script type="module" src="js/site-detail.js"></script>
</body>
</html>
